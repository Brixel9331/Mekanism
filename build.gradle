import net.fabricmc.loom.task.RemapJarTask

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

group = 'mekanism'
version = "${minecraft_version}-${mod_version}." + (System.getenv('BUILD_NUMBER') ?: 'homebaked')
base.archivesName = 'Mekanism'

def modules = ['additions', 'generators', 'tools']

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        url = 'https://mvn.devos.one/releases/'
        content { includeGroup 'io.github.fabricators_of_create.Porting-Lib' }
    }
    maven { url = 'https://maven.blamejared.com' }
    maven {
        url = 'https://maven.thiakil.com'
        content { includeGroup 'com.thiakil' }
    }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven {
        url = 'https://maven.ladysnake.org/releases'
        content { includeGroup 'dev.onyxstudios.cardinal-components-api' }
    }
    maven { url = 'https://maven.teamreborn.com' }
    maven { url = 'https://squiddev.cc/maven' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

sourceSets {
    api {
        resources.srcDirs = []
    }
    main {
        compileClasspath += api.output
        runtimeClasspath += api.output
        resources.srcDir 'src/datagen/generated/mekanism'
    }
}

modules.each { String moduleName ->
    def module = sourceSets.create(moduleName)
    module.resources.srcDir "src/datagen/generated/mekanism${moduleName}"
    module.compileClasspath += sourceSets.api.output + sourceSets.main.output
    module.runtimeClasspath += sourceSets.api.output + sourceSets.main.output
}

(['main'] + modules).each { String moduleName ->
    def module = sourceSets.getByName(moduleName)
    if (moduleName != 'main') {
        module.compileClasspath += sourceSets.main.compileClasspath
        module.runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    def data = sourceSets.create("datagen${moduleName.capitalize()}")
    data.java.srcDirs = ["src/datagen/${moduleName}/java"]
    data.resources.srcDirs = ["src/datagen/${moduleName}/resources"]
    data.compileClasspath += sourceSets.api.output + sourceSets.main.output + module.output + sourceSets.main.compileClasspath
    data.runtimeClasspath += sourceSets.api.output + sourceSets.main.output + module.output + sourceSets.main.runtimeClasspath
    if (moduleName != 'main') {
        data.compileClasspath += sourceSets.datagenMain.output + sourceSets.datagenMain.compileClasspath
        data.runtimeClasspath += sourceSets.datagenMain.output + sourceSets.datagenMain.runtimeClasspath
    }
    tasks.named(module.compileJavaTaskName, JavaCompile) {
        options.annotationProcessorPath = configurations.annotationProcessor
        options.compilerArgs += ["-AmekanismModule=mekanism${moduleName == 'main' ? '' : moduleName}"]
    }
    configurations.named(module.implementationConfigurationName) {
        if (moduleName != 'main') {
            extendsFrom configurations.implementation
        }
    }
    configurations.named(data.implementationConfigurationName) {
        extendsFrom configurations.implementation
        if (moduleName != 'main') {
            extendsFrom configurations.datagenMainImplementation
        }
    }
}

sourceSets.datagenMain.java.exclude(
      'mekanism/common/recipe/compat/BYGRecipeProvider.java',
      'mekanism/common/recipe/compat/ILikeWoodRecipeProvider.java',
      'mekanism/common/recipe/compat/ILikeWoodBOPRecipeProvider.java',
      'mekanism/common/recipe/compat/ILikeWoodBYGRecipeProvider.java'
)

sourceSets.api.compileClasspath += configurations.compileClasspath
sourceSets.api.runtimeClasspath += configurations.runtimeClasspath
sourceSets.test.compileClasspath += sourceSets.api.output
sourceSets.test.runtimeClasspath += sourceSets.api.output
modules.each { String moduleName ->
    sourceSets.test.compileClasspath += sourceSets.getByName(moduleName).output
    sourceSets.test.runtimeClasspath += sourceSets.getByName(moduleName).output
}

configurations {
    apiImplementation.extendsFrom implementation
    apiCompileOnly.extendsFrom compileOnly
    apiRuntimeOnly.extendsFrom runtimeOnly
}

loom {
    createRemapConfigurations(sourceSets.test)
    (['main'] + modules).each { String moduleName ->
        createRemapConfigurations(sourceSets.getByName("datagen${moduleName.capitalize()}"))
    }
    accessWidenerPath = file('src/main/resources/mekanism.accesswidener')
    mods {
        mekanism {
            sourceSet sourceSets.api
            sourceSet sourceSets.main
        }
        modules.each { String moduleName ->
            register("mekanism${moduleName}") {
                sourceSet sourceSets.getByName(moduleName)
            }
        }
    }
    runs {
        client {
            client()
        }
        server {
            server()
            programArg 'nogui'
        }
    }
    (['main'] + modules).each { String moduleName ->
        def data = sourceSets.getByName("datagen${moduleName.capitalize()}")
        def modId = "mekanism${moduleName == 'main' ? '' : moduleName}"
        mods.register("${modId}_datagen") { sourceSet data }
        runs.register("datagen${moduleName.capitalize()}") {
            client()
            source data
            property 'fabric-api.datagen'
            property 'fabric-api.datagen.strict-validation'
            property 'fabric-api.datagen.modid', "${modId}_datagen"
            property 'fabric-api.datagen.output-dir', providers.gradleProperty('datagenOutput').getOrElse(file("src/datagen/generated/${modId}").absolutePath)
            runDir project.relativePath(providers.gradleProperty('datagenRunDir').getOrElse(layout.buildDirectory.dir("datagen-runtime/${moduleName}").get().asFile.absolutePath))
            ideConfigGenerated false
        }
    }

}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    for (String portingModule : ['core', 'model_loader', 'obj_loader']) {
        modImplementation include("io.github.fabricators_of_create.Porting-Lib:${portingModule}:${porting_lib_version}") {
            transitive = false
        }
    }
    for (String portingModule : ['data', 'model_generators', 'model_materials', 'utility']) {
        modDatagenMainImplementation("io.github.fabricators_of_create.Porting-Lib:${portingModule}:${porting_lib_version}") {
            transitive = false
        }
    }
    modDatagenMainRuntimeOnly("com.blamejared.crafttweaker:CraftTweaker-fabric-${minecraft_version}:${crafttweaker_version}") {
        exclude group: 'org.ow2.asm'
        exclude group: 'org.slf4j'
        exclude group: 'net.fabricmc'
        exclude group: 'net.fabricmc.fabric-api'
    }
    datagenMainImplementation("com.thiakil:yaml-ops:${yamlops_version}") {
        exclude group: 'com.mojang', module: 'datafixerupper'
    }
    modImplementation include("teamreborn:energy:${team_reborn_energy_version}")
    modImplementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:8.0.3") {
        transitive = false
    }
    include("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:8.0.3") {
        transitive = false
    }
    modImplementation("me.lucko:fabric-permissions-api:0.3.1") {
        transitive = false
    }
    include("me.lucko:fabric-permissions-api:0.3.1") {
        transitive = false
    }
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modLocalRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    modCompileOnly "com.blamejared.crafttweaker:CraftTweaker-fabric-${minecraft_version}:${crafttweaker_version}"
    modCompileOnly "com.blamejared.jeitweaker:JeiTweaker-fabric-${minecraft_version}:${jeitweaker_version}"
    modCompileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-fabric-api:${cc_tweaked_version}"
    modCompileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cc_tweaked_version}"
    modCompileOnly 'maven.modrinth:trinkets:AHxQGtuC'
    modCompileOnly('dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.2') {
        transitive = false
    }
    modCompileOnly('dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.2') {
        transitive = false
    }
    modCompileOnly 'maven.modrinth:bcOsQHnC:nYZ0oktX'
    modCompileOnly 'maven.modrinth:jade:SlsObyHn'
    modCompileOnly 'maven.modrinth:wthit:z1T650Hb'
    modCompileOnly 'maven.modrinth:badpackets:JjLWLyDz'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    annotationProcessor project(':annotation-processor')
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
    testImplementation "org.quicktheories:quicktheories:${quicktheories_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xmaxerrs', '1000', '-parameters']
}

tasks.withType(ProcessResources).configureEach {
    exclude '**/.cache/**', '**/*.blend', '**/*.bbmodel'
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.named('jar', Jar) {
    from sourceSets.api.output
    from('LICENSE')
    from('logo.png')
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

modules.each { String moduleName ->
    def module = sourceSets.getByName(moduleName)
    def moduleJar = tasks.register(module.jarTaskName, Jar) {
        from module.output
        from('LICENSE')
        from('logo.png')
        archiveBaseName = "Mekanism${moduleName.capitalize()}"
        archiveClassifier = 'dev'
        destinationDirectory = layout.buildDirectory.dir('devlibs')
        duplicatesStrategy = DuplicatesStrategy.FAIL
    }
    def remap = tasks.register("remap${moduleName.capitalize()}Jar", RemapJarTask) {
        dependsOn moduleJar
        inputFile = moduleJar.flatMap { it.archiveFile }
        archiveBaseName = "Mekanism${moduleName.capitalize()}"
        archiveClassifier = ''
        classpath.from sourceSets.api.output, sourceSets.main.output, module.compileClasspath
    }
    tasks.named('assemble') {
        dependsOn remap
    }
}

tasks.named('sourcesJar', Jar) {
    from sourceSets.api.allSource
    modules.each { String moduleName ->
        from sourceSets.getByName(moduleName).allSource
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir = layout.buildDirectory.dir('test-runtime')
    doFirst { workingDir.mkdirs() }
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '8.11'
    distributionType = Wrapper.DistributionType.BIN
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
