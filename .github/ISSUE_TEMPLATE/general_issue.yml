name: Mekanism Fabric issue
description: Report a bug or problem with the unofficial Fabric port for Minecraft 1.20.1
body:
  - type: markdown
    attributes:
      value: |
        This form is for the unofficial Mekanism Fabric port for Minecraft 1.20.1.
        Search this repository's open and closed issues before reporting a problem.
        For feature requests, open a blank issue in this repository.
  - type: textarea
    id: issue-description
    attributes:
      label: Issue description
      description: A clear and concise description of the issue and if appropriate what the expected outcome should have been.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: If there are specific steps that need to be taken to reproduce the issue list them here.
      placeholder: |
        1. Start by doing...
        2. Next do...
        3. See result described above
  - type: dropdown
    id: minecraft-version
    attributes:
      label: Minecraft version
      description: This Fabric port targets Minecraft 1.20.1.
      options:
        - "1.20.1"
    validations:
      required: true
  - type: input
    id: fabric-loader-version
    attributes:
      label: Fabric Loader version
      description: What version of Fabric Loader are you using?
      placeholder: e.g. 0.18.2
    validations:
      required: true
  - type: input
    id: fabric-api-version
    attributes:
      label: Fabric API version
      description: What version of Fabric API are you using?
      placeholder: e.g. 0.92.6+1.20.1
    validations:
      required: true
  - type: input
    id: mekanism-version
    attributes:
      label: Mekanism Fabric version
      description: Provide the full Fabric port version or jar filename. For manual builds, include the git commit hash.
      placeholder: e.g. Mekanism-Fabric-1.20.1-10.4.16.fabric.1.jar
    validations:
      required: true
  - type: textarea
    id: other-versions
    attributes:
      label: Other relevant versions
      description: If this issue is related to any other mods list their versions here.
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Attach the latest.log or crash report from the affected run, or paste the relevant excerpt.
